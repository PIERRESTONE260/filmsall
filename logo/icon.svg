<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé de fond (Bleu Nuit Premium) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151a28" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    
    <!-- Dégradé Rouge Netflix/MovieBox -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    
    <!-- Effet de brillance pour le bouton Play -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. FOND DE L'APPLICATION (Carré aux bords arrondis) -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- 2. LE GLOBE (Pour représenter le Monde Entier / "all") -->
  <g transform="translate(256, 170)" stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="0" cy="0" r="90" />
    <ellipse cx="0" cy="0" rx="40" ry="90" />
    <line x1="0" y1="-90" x2="0" y2="90" />
    <line x1="-90" y1="0" x2="90" y2="0" />
    <ellipse cx="0" cy="0" rx="90" ry="40" />
  </g>

  <!-- 3. LA PELLICULE DE CINÉMA (Entoure le globe) -->
  <!-- Anneau rouge -->
  <circle cx="256" cy="170" r="110" fill="none" stroke="url(#redGradient)" stroke-width="25" />
  <!-- Trous de la pellicule (Lignes noires qui coupent l'anneau) -->
  <circle cx="256" cy="170" r="110" fill="none" stroke="#0b0f19" stroke-width="27" stroke-dasharray="15 20" />

  <!-- 4. LE BOUTON PLAY (Le Streaming) -->
  <polygon points="235,120 235,220 310,170" fill="#ffffff" filter="url(#glow)" />

  <!-- 5. LE NOM DE LA MARQUE -->
  <text x="256" y="355" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="90" font-weight="900" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#ffffff">FILMS</tspan><tspan fill="#E50914">all</tspan>
  </text>

  <!-- 6. LE SLOGAN (Ce que fait l'application !) -->
  <rect x="96" y="390" width="320" height="46" rx="23" fill="#E50914" opacity="0.15" />
  <text x="256" y="419" font-family="Arial, sans-serif" font-size="18" fill="#ff4b4b" font-weight="bold" text-anchor="middle" letter-spacing="3">FILMS • SÉRIES • MUSIQUE</text>
  
  <!-- 7. SOUS-TITRE MONDIAL -->
  <text x="256" y="465" font-family="Arial, sans-serif" font-size="12" fill="#5c6b7a" font-weight="bold" text-anchor="middle" letter-spacing="4">STREAMING MONDIAL</text>

</svg>