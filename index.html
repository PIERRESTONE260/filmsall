<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FILMSall - Accueil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo/filmsall.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <nav class="navbar">
        <div class="logo-container"><img src="logo/filmsall.png" class="logo-img"></div>
        <div class="search-box"><input type="text" id="search-input" placeholder="Rechercher..."><button id="search-btn"><i class="fas fa-search"></i></button></div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Films</a></li>
            <li><a href="musique.html">Musique</a></li>
            <li><a href="images.html">Galerie</a></li>
        </ul>
    </nav>

    <!-- BARRE DE NAVIGATION HORIZONTALE SOUS LA NAVBAR -->
    <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-filter="tout">Tout</button>
        <button class="filter-tab" data-filter="film">Films</button>
        <button class="filter-tab" data-filter="serie">Séries</button>
        <button class="filter-tab" data-filter="animation">Animés</button>
        <button class="filter-tab" data-filter="manga">Mangas</button>
        <button class="filter-tab" data-filter="musique">Musiques</button>
    </div>

    <header class="hero" id="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="hero-title">...</h1>
            <p id="hero-desc" style="color:#aaa; font-size:13px; margin-bottom:10px;"></p>
            <button class="btn btn-white" id="hero-play"><i class="fas fa-play"></i> LECTURE</button>
        </div>
    </header>

    <main id="main-container"></main>

    <div id="video-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal"><i class="fas fa-times"></i></span>
            <div id="video-wrapper" class="video-container"></div>
            <div id="modal-cover" class="modal-cover"><button id="center-play-btn" class="center-play"><i class="fas fa-play"></i></button></div>
            <div id="modal-info" class="modal-info">
                <div class="modal-title-row"><h2 id="modal-title">Titre</h2></div>
                <div class="modal-meta"><span id="modal-year"></span> • <span id="modal-cat" style="color:var(--primary);"></span></div>
                <p id="modal-desc" style="color:#ccc; font-size:13px;"></p>
                <div id="action-grid" class="action-grid"></div>
                <div id="series-area" style="display:none;"><select id="season-select" class="season-select"></select><div id="episodes-list" class="episodes-list"></div></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active"><i class="fas fa-home"></i><span>Accueil</span></a>
        <a href="images.html" class="bottom-nav-item"><i class="fas fa-th-large"></i><span>Galerie</span></a>
        <a href="annonces.html" class="bottom-nav-item"><i class="fas fa-bell"></i><span>Annonces</span></a>
        <a href="musique.html" class="bottom-nav-item"><i class="fas fa-music"></i><span>Musique</span></a>
        <a href="apropos.html" class="bottom-nav-item"><i class="fas fa-user-circle"></i><span>Profil</span></a>
    </nav>

    <div id="install-banner" class="install-banner" style="display:none;"><div class="install-content"><img src="logo/filmsall.png" class="install-logo"><div class="install-text"><h3>Installer FILMSall</h3></div></div><button id="install-btn" class="btn-install">INSTALLER</button><button id="close-install" class="btn-close">✕</button></div>

    <script src="script.js"></script>
</body>
</html>
