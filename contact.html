<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
     <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo/filmsall.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #101120;
    }
    h1 {
        color: #f80808;
    }
    h2 {
        color: #f70505;
    }
    p {
        color: #fcfcfc;
    }
    a {
        color: #05f398;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
    form {
        background-color: #524f4f;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        max-width: 500px;
        margin-top: 20px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        color: #f70505;
    }
    input[type="text"],
    input[type="email"],
    textarea {
        width: 90%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    input[type="submit"] {
        background-color: #080808;
        color: rgb(242, 247, 244);
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    input[type="submit"]:hover {
        background-color: #0056b3;
    }
    button {
        background-color: #080808;
        color: rgb(242, 247, 244);
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 20px;
    }
</style>
<body>
    <h1>Contactez-nous</h1>
    <p>Pour toute question ou assistance, veuillez nous contacter à l'adresse suivante :</p>
    <p>Email : <a href="mailto:filmsall190@gmail.com">filmsall190@gmail.com</a></p>
    <p>Nous sommes également disponibles sur les réseaux sociaux :</p>
    <ul>
        <li><a href="https://www.facebook.com/filmsall">Facebook</a></li>
        <li><a href="https://www.twitter.com/filmsall">Twitter</a></li>
        <li><a href="https://www.instagram.com/filmsall">Instagram</a></li>
    </ul>
    <div>
        <h2>Formulaire de contact</h2>
        <form id="contact-form" method="post">
            <label for="name">Nom :</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email :</label><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="message">Message :</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br><br>
            <input type="submit" value="Envoyer">
        </form>
    </div>
    <button type="button" onclick="window.history.back()">Retour</button>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Merci pour votre message ! Nous vous répondrons dans les plus brefs délais.');
            this.reset();
        });
        // envoyé sur mon compte email pour test :
         document.getElementById('contact-form').addEventListener('submit', function(event) {
             event.preventDefault();

             const name = document.getElementById('name').value;
             const email = document.getElementById('email').value;
             const message = document.getElementById('message').value;
             const mailtoLink = `mailto:filmsall190@gmail.com?subject=Contact&body=Nom: ${name}%0AEmail: ${email}%0AMessage: ${message}`;
             window.location.href = mailtoLink;
         });
         // bouton retour :
         function goBack() {
             window.history.back();
         }
    </script>
</body>
</html>
