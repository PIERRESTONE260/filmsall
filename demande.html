<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Commander - FILMSall</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo/filmsall.png">
</head>
<body>
    <div class="request-container">
        <div class="price-card">
            <h2>Commande VIP</h2>
            <div class="price">1$</div>
            <p>On trouve le film pour vous !</p>
        </div>
        <div class="form-section">
            <form id="reqForm">
                <input type="text" id="nom" placeholder="Votre Nom" class="form-group" required>
                <input type="text" id="film" placeholder="Titre du film/série" class="form-group" required>
                <button type="submit" class="btn-submit">Envoyer via WhatsApp</button>
            </form>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fas fa-arrow-left"></i><span>Retour</span></a>
    </nav>

    <script>
        document.getElementById('reqForm').onsubmit = (e) => {
            e.preventDefault();
            let msg = `Salut Pierre-Stone, je veux commander le film : ${document.getElementById('film').value} (Nom: ${document.getElementById('nom').value}).`;
            // METS TON NUMERO WHATSAPP ICI (avec le code pays, ex: 243...)
            window.location.href = `https://wa.me/243000000000?text=${encodeURIComponent(msg)}`;
        };
    </script>
</body>
</html>
